<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="100%" stop-color="#00fa44"/>
    </linearGradient>
    <filter id="cyber-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="120" fill="#090a0f" />
  
  <!-- Hexagon border -->
  <path d="M 256 50 L 440 156 L 440 368 L 256 474 L 72 368 L 72 156 Z" fill="none" stroke="url(#neon-grad)" stroke-width="8" filter="url(#cyber-glow)" opacity="0.8"/>
  <path d="M 256 50 L 440 156 L 440 368 L 256 474 L 72 368 L 72 156 Z" fill="none" stroke="url(#neon-grad)" stroke-width="2"/>
  
  <!-- Tech ring -->
  <circle cx="256" cy="262" r="140" fill="none" stroke="#00fa44" stroke-width="4" stroke-dasharray="15,25" opacity="0.4" />
  <circle cx="256" cy="262" r="180" fill="none" stroke="#00ffff" stroke-width="2" stroke-dasharray="4,8" opacity="0.3" />
  
  <!-- Terminal Prompt: >_ -->
  <g fill="none" stroke="url(#neon-grad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" filter="url(#cyber-glow)">
    <polyline points="150,190 230,262 150,334" />
    <line x1="250" y1="334" x2="362" y2="334" />
  </g>
  <g fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="150,190 230,262 150,334" />
    <line x1="250" y1="334" x2="362" y2="334" />
  </g>
  
  <!-- Decorative nodes -->
  <circle cx="256" cy="50" r="12" fill="#00ffff" filter="url(#cyber-glow)" />
  <circle cx="440" cy="156" r="8" fill="#00fa44" filter="url(#cyber-glow)" />
  <circle cx="440" cy="368" r="8" fill="#00ffff" filter="url(#cyber-glow)" />
  <circle cx="256" cy="474" r="12" fill="#00fa44" filter="url(#cyber-glow)" />
  <circle cx="72" cy="368" r="8" fill="#00ffff" filter="url(#cyber-glow)" />
  <circle cx="72" cy="156" r="8" fill="#00fa44" filter="url(#cyber-glow)" />
</svg>